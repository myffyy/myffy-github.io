<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#e8e7e2" />
		<meta
			name="description"
			content="myffy — personal digital presence. Get in touch on Telegram."
		/>
		<title>myffy.</title>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23191919'/%3E%3Ctext x='14' y='75' fill='%23eee' font-size='85' font-family='Arial'%3Em%3C/text%3E%3C/svg%3E"
		/>
		<link
			rel="preload"
			href="fonts/SpaceGrotesk-Variable.ttf"
			as="font"
			type="font/ttf"
			crossorigin
		/>
		<link rel="stylesheet" href="common.css" />
		<link rel="stylesheet" href="style.css" />
		<script src="theme.js"></script>
		<script src="loader.js"></script>
		<script src="script.js" defer></script>
	</head>
	<body>
		<iframe
			class="loading-frame"
			id="loading-frame"
			src="loading.html"
			title="Connecting to personal space"
		></iframe>
		<header class="site-header">
			<a class="wordmark" href="./" aria-label="myffy — home"
				>m<span>✳</span></a
			>
			<span class="micro header-label">PERSONAL SPACE / 001</span>
			<button
				id="theme"
				class="theme micro"
				aria-label="Toggle color theme"
				aria-pressed="false"
			>
				LIGHT / DARK <span aria-hidden="true">◐</span>
			</button>
		</header>
		<main>
			<div class="intro">
				<span class="availability micro" role="status" aria-live="polite">
					<i class="dot" aria-hidden="true"></i>
					<span id="availability-label">CHECKING STATUS</span>
				</span>
				<span class="schedule micro">ONLINE EVERYDAY 10:00–0:00 MSK</span>
			</div>
			<section class="stage" aria-labelledby="name">
				<h1 id="name">myffy.</h1>
				<div class="side-note micro">SOMEWHERE ON THE INTERNET.</div>
				<figure class="portrait">
					<div class="avatar-circle">
						<img
							src="images/avatar.png"
							alt="myffy avatar with dark hair, black glasses and a black T-shirt"
							fetchpriority="high"
						/>
					</div>
					<figcaption class="micro">FIG. 01 — MYFFY</figcaption>
				</figure>
			</section>
			<section class="contact" aria-label="Get in touch">
				<h2 class="coordinates">
					<span>YOU FOUND ME.</span>
					<span>LET’S STAY IN TOUCH.</span>
				</h2>
				<a
					class="telegram"
					aria-label="Message myffy on Telegram"
					href="https://t.me/myffy"
					target="_blank"
					rel="noopener noreferrer"
				>
					<svg class="telegram-logo" viewBox="0 0 24 24" aria-hidden="true">
						<path
							fill="currentColor"
							d="M21.4 3.3 18.1 20c-.2 1.2-.9 1.5-1.9.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.3L5.4 13.4.5 11.9c-1.1-.3-1.1-1.1.2-1.6L20 2.9c.9-.3 1.6.2 1.4.4Z"
						/>
					</svg>
					<span>Telegram</span>
				</a>
			</section>
		</main>
		<footer class="micro">
			<span><span id="year">2026</span> MYFFY</span>
			<span class="footer-center">A SMALL PAGE. A REAL CONNECTION.</span>
			<span>END OF PAGE <span aria-hidden="true">✳</span></span>
		</footer>
	</body>
</html>
